<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Conversion</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Metric/Imperial Unit Conversion</h1>
            <input name="unit-value" id="unit-input" placeholder="20">
            <button id="convert-btn" name="unit-value">Convert</button>
        </div>
        <div class="measurements">
            <div class="list">
                <div class="title">Length (Meter/Feet)</div>
                <div class="conversions"><span id="length">20</span> meters = 65.616 feet | <span id="length">20</span> feet = 6.096 meters</div>
            </div>
            <div class="list">
                <div class="title">Volume (Liters/Gallons)</div>
                <div class="conversions"><span id="volume">20</span> liters = 5.284 gallons | <span id="volume">20</span> gallons = 75.708 liters</div>
            </div>
            <div class="list">
                <div class="title">Mass (Kilograms/Pounds)</div>
                <div class="conversions"><span id="mass">20</span> kilos = 44.092 pounds | <span id="mass">20</span> pounds = 9.072 kilos</div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
