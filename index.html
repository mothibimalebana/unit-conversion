<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Conversion</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Metric/Imperial Unit Conversion</h1>
            <input name="unit-value" id="unit-input" placeholder="20">
            <button id="convert-btn" name="unit-value">convert</button>
        </div>
        <div class="measurements">
            <div id="length">
                <div class="title">Length (Meter/Feet)</div>
                <div class="conversions">20 meters = 65.616 feet | 20 feet = 6.096 meters</div>
            </div>
            <div id="volume">
                <div class="title">Volume (Liters/Gallons)</div>
                <div class="conversions">20 liters = 5.284 gallons | 20 gallons = 75.708 liters</div>
            </div>
            <div id="mass">
                <div class="title">Mass (Kilograms/Pounds)</div>
                <div class="conversions">20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</div>
            </div>
        </div>
    </div>
</body>
</html>
