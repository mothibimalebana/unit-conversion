<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Conversion</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Metric/Imperial Unit Conversion</h1>
            <input name="unit-value" id="unit-input" placeholder="20">
            <button id="convert-btn" name="unit-value">Convert</button>
        </div>
        <div class="measurements">
            <div class="list">
                <div class="title">Length (Meter/Feet)</div>
                <div class="conversions"><span class="units-input">20</span> meters = <span id="length-m">65.616</span> feet | <span class="units-input">20</span> feet = <span id="length-f">6.096</span> meters</div>
            </div>
            <div class="list">
                <div class="title">Volume (Liters/Gallons)</div>
                <div class="conversions"><span class="units-input">20</span> liters = <span id="volume-g">5.284</span> gallons | <span class="units-input">20</span> gallons = <span id="volume-l">5.75.708</span> liters</div>
            </div>
            <div class="list">
                <div class="title">Mass (Kilograms/Pounds)</div>
                <div class="conversions"><span class="units-input">20</span> kilos = <span id="mass-k">44.092</span> pounds | <span class="units-input">20</span> pounds = <span id="mass-p">9.072</span> kilos</div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
